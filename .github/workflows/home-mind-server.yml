name: Home Mind server

on:
  pull_request:
    paths:
      - .github/workflows/home-mind-server.yml
      - src/home-mind-server/**
  push:
    branches: [main]
    paths:
      - .github/workflows/home-mind-server.yml
      - src/home-mind-server/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/home-mind-server
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/home-mind-server/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: docker build --tag home-mind-server:test .

  publish:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - id: package
        working-directory: src/home-mind-server
        run: node -e "console.log('version=' + require('./package.json').version)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: src/home-mind-server
          push: true
          tags: |
            ghcr.io/unknown-sh/home-mind-server:${{ steps.package.outputs.version }}
            ghcr.io/unknown-sh/home-mind-server:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/unknown-sh/home-mind
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0
