name: Home Mind server

on:
  pull_request:
    paths:
      - .github/workflows/home-mind-server.yml
      - src/home-mind-server/**
  push:
    branches: [main]
    paths:
      - .github/workflows/home-mind-server.yml
      - src/home-mind-server/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/home-mind-server
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/home-mind-server/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: docker build --tag home-mind-server:test .

  publish:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - id: package
        working-directory: src/home-mind-server
        run: node -e "console.log('version=' + require('./package.json').version)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: src/home-mind-server
          push: true
          tags: |
            ghcr.io/unknown-sh/home-mind-server:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/unknown-sh/home-mind
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.package.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0
          provenance: mode=max
          sbom: true
